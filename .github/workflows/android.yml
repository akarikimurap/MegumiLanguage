name: Android APK

# v ile başlayan bir etiket gönderildiğinde (ör. v1.0.0) APK derlenir ve Releases'e eklenir.
# Actions sekmesinden elle de çalıştırılabilir (APK "Artifacts" altında çıkar).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Android projesini ve simgeleri oluştur
        run: |
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#d94f70' --iconBackgroundColorDark '#d94f70' --splashBackgroundColor '#fbf7f4' --splashBackgroundColorDark '#161113'
          npx cap sync android

      - name: Sürüm numarasını ayarla
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VERSION_NAME="${GITHUB_REF_NAME#v}"; else VERSION_NAME="0.0.${GITHUB_RUN_NUMBER}"; fi
          # versionCode her derlemede artar; böylece yeni APK eskisinin üzerine kurulabilir
          sed -i "s/versionCode 1$/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: APK imzala
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secret'ları eksik. README'deki 'İmzalama anahtarı' bölümüne bak."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > megumi.jks
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks megumi.jks --ks-key-alias megumi \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "Megumi-${VERSION_NAME}.apk" aligned.apk
          "$BT/apksigner" verify "Megumi-${VERSION_NAME}.apk"
          rm -f megumi.jks aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Megumi-${{ env.VERSION_NAME }}
          path: Megumi-*.apk

      - name: Sürümü yayınla
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: Megumi-*.apk
          body: |
            📱 **Kurulum:** Aşağıdaki `Megumi-${{ env.VERSION_NAME }}.apk` dosyasını telefonuna indirip aç.
            İlk kurulumda Android "bilinmeyen kaynaklardan uygulama yükleme" izni isteyecek; tarayıcına (veya Dosyalar uygulamasına) bu izni ver.
            Güncelleme için yeni APK'yı eskisinin üzerine kurman yeterli — ilerlemen korunur.
